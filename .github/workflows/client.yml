name: Client (dkrix)

# Builds the Windows client. This is the primary validation target per
# the workspace-root CLAUDE.md, and the one that cannot be reproduced on Linux --
# MSVC is Windows-only, so this workflow is the only way anyone other than
# the workstation owner can tell whether the client still compiles.
#
# The runner approximates the documented local command from CLAUDE.md:
#   cmake -S dkrix -B dkrix\build -G "Visual Studio 17 2022" -A x64 \
#         -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake
#
# It does NOT reproduce it exactly: the -G pin is dropped here. See the comment
# on the Configure step. [2026-08-06] Run #3 failed at configure with "could not
# find any instance of Visual Studio" for that generator name, on a runner where
# vcpkg had just built SDL2 successfully — so MSVC was present and only the
# version-specific generator string was stale.
#
# windows-latest ships vcpkg preinstalled and exports VCPKG_INSTALLATION_ROOT,
# so no third-party action is needed.

on:
  push:
    branches: [main, "modernize/**"]
    paths:
      - "dkrix/**"
      - ".github/workflows/client.yml"
  pull_request:
    branches: [main]
    paths:
      - "dkrix/**"
      - ".github/workflows/client.yml"
  workflow_dispatch:

jobs:
  build:
    name: MSVC x64 (${{ matrix.config }})
    runs-on: windows-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        config: [Debug]

    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ runner.os }}-sdl2-v1
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Install SDL2 dependencies via vcpkg
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_cache
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
              sdl2 sdl2-image sdl2-ttf sdl2-mixer libjpeg-turbo `
              --triplet x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }

      # Report what the runner actually has before trying to use it. The first
      # run failed here with "could not find any instance of Visual Studio"
      # while the vcpkg step above had just succeeded — so MSVC was present and
      # only the hardcoded generator name was wrong.
      - name: Show available Visual Studio installations
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -products * -format value -property displayName
            & $vswhere -products * -format value -property installationVersion
          } else {
            Write-Host "vswhere.exe not found at $vswhere"
          }
          cmake --version

      # Deliberately does NOT pin -G. The generator was hardcoded to
      # "Visual Studio 17 2022" to mirror the documented local command, but the
      # runner image moves and that name is version-specific. Omitting -G lets
      # CMake select the newest installed VS generator; -A x64 still pins the
      # architecture and works with any VS generator.
      #
      # Trade-off, recorded deliberately: CI may now build with a different MSVC
      # than the workstation ships with (CLAUDE.md documents VS 2022 + vcpkg as
      # the release path). That is a real divergence. It is preferable to a
      # workflow that cannot run at all, and a newer compiler surfacing new
      # diagnostics is information rather than noise. If exact parity matters
      # more than resilience, pin `runs-on: windows-2022` instead of pinning -G.
      - name: Configure
        shell: pwsh
        run: |
          cmake -S dkrix -B dkrix/build `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }

      # Build the game client target specifically. The tree also defines
      # viewer/validator executables; those are built separately below so a
      # broken viewer does not mask a broken client (or vice versa).
      - name: Build DarkEden
        shell: pwsh
        run: |
          cmake --build dkrix/build --config ${{ matrix.config }} --target DarkEden -- /m /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "DarkEden build failed" }

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dkrix/build -Recurse -Filter Darkeden.exe -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $exe) { throw "Darkeden.exe was not produced" }
          Write-Host "ok: $($exe.FullName)  ($([math]::Round($exe.Length/1MB,1)) MB)"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-build-logs-${{ matrix.config }}
          path: |
            dkrix/build/**/*.log
            dkrix/build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7

  tools:
    name: Viewers and validators
    runs-on: windows-latest
    timeout-minutes: 120
    # Non-blocking: the viewer binaries depend on the second sprite system in
    # tools/engine/sprite/, which the game client does not link.
    #
    # [updated 2026-08-06] The original note said to flip this off "once Phase 4
    # lands". Phase 4 was re-scoped — see docs/adr/0001-sprite-pipeline.md — and
    # tools/engine/sprite/ is now expected to STAY as the viewers' library
    # rather than be removed. So the right trigger is different: flip this off
    # once the viewer targets are known to build, which nothing has established
    # yet because this workflow has never run.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ runner.os }}-sdl2-v1
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Install SDL2 dependencies via vcpkg
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_cache
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
              sdl2 sdl2-image sdl2-ttf sdl2-mixer libjpeg-turbo `
              --triplet x64-windows

      # Same reasoning as the build job: no pinned -G.
      - name: Configure and build all targets
        shell: pwsh
        run: |
          cmake -S dkrix -B dkrix/build-tools `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          cmake --build dkrix/build-tools --config Debug -- /m /v:minimal

  sanitizers-linux:
    name: Linux sanitizer (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Non-blocking, same as the `tools` job above: this leg has never
    # been run against this tree before. Windows/MSVC is this repo's
    # authoritative client build (dkrix/CLAUDE.md); Linux is documented
    # there only as "a secondary portability target", and the USE_ASAN/
    # USE_UBSAN CMake options only take effect under GNU/Clang (a no-op
    # warning under MSVC, per CMakeLists.txt), so a sanitizer leg can't
    # be added to the existing Windows job at all — it needs its own
    # Linux toolchain and SDL2 dep install, hence a separate job here
    # rather than a matrix leg bolted onto `build`.
    #
    # Deliberately does not include macOS: dkrix/CLAUDE.md calls macOS
    # sanitizer support merely "historical", while Linux is the current
    # (if secondary) portability claim — narrower scope than the parked
    # line's Phase 15E (9832499), which ran ubuntu+macos x3 sanitizers
    # against a tree whose client CI had no Windows job at all. TSan is
    # excluded from the matrix for the same reason as the server leg in
    # server.yml: the client's thread model is unaudited, and the
    # Makefile's `debug-tsan` target still exists for local use.
    continue-on-error: true
    defaults:
      run:
        working-directory: dkrix

    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, ubsan]
        include:
          - sanitizer: asan
            make_target: debug-asan
          - sanitizer: ubsan
            make_target: debug-ubsan

    steps:
      - uses: actions/checkout@v4

      # See CMakeLists.txt find_package(SDL2/SDL2_image/SDL2_ttf
      # REQUIRED). SDL2_mixer is optional (graceful-degrade audio path)
      # but installed anyway for parity with the dep set noted in
      # dkrix/CLAUDE.md.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-ttf-dev \
            libsdl2-mixer-dev \
            libjpeg-dev

      - name: Show toolchain versions
        run: |
          cc --version | head -1
          c++ --version | head -1
          cmake --version | head -1

      # Invokes the Makefile target added alongside the CMakeLists.txt
      # USE_<SAN>=ON options (Phase 10 bullet 3, 2026-08-07) — same
      # recipe as local dev.
      - name: Build (${{ matrix.make_target }})
        run: make ${{ matrix.make_target }}

      # CMAKE_RUNTIME_OUTPUT_DIRECTORY is ${CMAKE_BINARY_DIR}/bin, so
      # unlike the server tree this DOES vary per build-<san> directory.
      - name: Verify binary
        run: |
          binary="build-${{ matrix.sanitizer }}/bin/DarkEden"
          if [ -x "$binary" ]; then
            echo "Built: $binary"
            ls -la "$binary"
          else
            echo "ERROR: expected binary $binary was not produced"
            ls -la "build-${{ matrix.sanitizer }}/bin/" 2>/dev/null || echo "(no build-${{ matrix.sanitizer }}/bin/)"
            exit 1
          fi
