name: Server (dkrixserver)

# Builds the Linux server tree. This is the authoritative server
# verification path from the workspace-root CLAUDE.md, run on every push instead of
# only on this workstation.

# Trigger policy [changed 2026-08-10]. The branch allowlist was
# [main, "modernize/**"]. `fix/bug-18b-loginserver-result-uaf` matched
# neither and no PR existed, so all 27 commits of the Phase 18 security
# work — every one of them a fix to a crash or a memory-safety defect —
# were never built by CI at all. Two format-only commits were written on
# that branch to satisfy a gate that never ran.
#
# The allowlist is now gone rather than extended with `fix/**`. Adding a
# pattern only moves the trap: the next branch prefix nobody thought of
# fails exactly the same way, silently, and the failure is invisible
# precisely when it matters (a branch created in a hurry to fix
# something). This repo is public, so Actions minutes are free, and the
# `paths:` filter below still skips docs-only pushes. Running on every
# branch costs runner time; not running is how 27 unbuilt commits happen.
on:
  push:
    paths:
      - "dkrixserver/**"
      - ".github/workflows/server.yml"
      - "tools/ci/**"
      # The packet-duplicates ratchet reads this client dir too; without
      # this filter a client-side packet add would skip the gate.
      - "dkrix/Client/Packet/Cpackets/**"
  pull_request:
    branches: [main]
    paths:
      - "dkrixserver/**"
      - ".github/workflows/server.yml"
      - "tools/ci/**"
      - "dkrix/Client/Packet/Cpackets/**"
  # Push-triggered runs have lagged 20+ minutes; workflow_dispatch returns
  # in seconds. Keep it on every workflow.
  workflow_dispatch:

# NOTE: working-directory is set per-job, NOT at workflow level. A workflow-level
# default also applies to the `format` job, where it silently breaks the check:
# `git diff --name-only` always prints repo-relative paths (dkrixserver/src/...),
# so the subsequent `[ -f "$f" ]` test runs from inside dkrixserver/ and looks for
# dkrixserver/dkrixserver/src/... — never found, every file skipped via `continue`,
# and the job passes green having checked nothing.

jobs:
  build:
    name: make debug (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: dkrixserver

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libmysqlclient-dev \
            liblua5.1-0-dev \
            libxerces-c-dev \
            libnsl-dev
        # libnsl-dev: all three server targets link -lnsl
        # (src/server/{gameserver,loginserver,sharedserver}/CMakeLists.txt,
        # EXTRA_LIBS under the elseif(UNIX) branch). libnsl was split out of
        # glibc in 2.32 and is NOT preinstalled on ubuntu-latest, so the link
        # step failed with "ld: cannot find -lnsl" after compiling to 86%.
        # First real CI failure, 2026-08-06.

      - name: Show toolchain
        run: |
          cmake --version
          g++ --version
          pkg-config --modversion xerces-c || true

      - name: Cache build tree
        uses: actions/cache@v4
        with:
          path: dkrixserver/build
          key: server-build-${{ runner.os }}-${{ hashFiles('dkrixserver/**/CMakeLists.txt') }}
          restore-keys: server-build-${{ runner.os }}-

      # The Makefile wraps CMake: `make debug` == cmake -B build
      # -DCMAKE_BUILD_TYPE=Debug && cmake --build build.
      - name: Build (Debug)
        run: make debug

      - name: Verify binaries exist
        run: |
          set -e
          for b in gameserver loginserver sharedserver; do
            if [ ! -f "bin/$b" ]; then
              echo "::error::Expected binary bin/$b was not produced"
              exit 1
            fi
            echo "ok: bin/$b"
          done

  sanitizers:
    # Additive leg, does not replace the plain `build` job above — same
    # dependency set, invoking the debug-asan / debug-ubsan Makefile
    # targets added alongside the CMakeLists.txt USE_<SAN> options
    # (Phase 10 bullet 3, 2026-08-07). TSan is deliberately excluded
    # from the matrix, same rationale as the parked line's Phase 15D
    # (archive/modernization-phases-1-17, 56f4165): the server's thread
    # model has not been audited and TSan on un-audited code produces
    # more false-positive noise than signal until real races are
    # addressed. `make debug-tsan` still works locally.
    #
    # This sanitizer matrix has never been run against this tree before
    # — CI is the actual gate for whether -fsanitize=address/undefined
    # compiles and links clean here, not this review.
    name: build (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Per-leg blocking, driven by `matrix.non_blocking` below. Both legs
    # started non-blocking (2026-08-07): neither had ever run, and the
    # plain `make debug` job above is what stayed red twice that day
    # (ff96e46, 421088e) before finally going green — an untested
    # sanitizer leg shouldn't be able to flip the whole workflow red
    # while it's still finding its feet.
    #
    # The flip rule (MODERNIZATION.md Phase 10 bullet 3): a leg becomes
    # blocking after ≥5 consecutive green runs of that leg. `asan`
    # reached that on 2026-08-09 and is now blocking; `ubsan` has never
    # been green and stays non-blocking. See the per-leg comments in the
    # matrix `include:` entries.
    continue-on-error: ${{ matrix.non_blocking }}
    defaults:
      run:
        working-directory: dkrixserver

    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, ubsan]
        include:
          # BLOCKING since 2026-08-09. [measured, job-level, Actions API]
          # `build (asan)` green on server runs #27 (c91eebb) → #31
          # (cc4ea8ba) — five consecutive. Over the leg's whole life
          # (#15 eb9fd2d1 onward) it is 13 green / 4 red, and all four
          # reds — #17, #19, #25, #26 — are runs where the plain
          # `make debug (ubuntu)` job was red too, i.e. the tree was
          # compile-broken for everyone. -fsanitize=address has never
          # failed on its own here.
          - sanitizer: asan
            make_target: debug-asan
            non_blocking: false
          # NON-BLOCKING. [measured] `build (ubsan)` has failed its own
          # `make debug-ubsan` step on every run it has ever had —
          # #15 (eb9fd2d1) through #31 (cc4ea8ba), 17 for 17, including
          # the 13 runs where both the plain build and the asan leg were
          # green. Consecutive greens: 0, and it has never had one.
          # Diagnosis: docs/ci-server-ubsan.md.
          - sanitizer: ubsan
            make_target: debug-ubsan
            non_blocking: true

    steps:
      - uses: actions/checkout@v4

      # Same dependency set as the `build` job above.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libmysqlclient-dev \
            liblua5.1-0-dev \
            libxerces-c-dev \
            libnsl-dev

      - name: Show toolchain
        run: |
          cmake --version
          g++ --version

      - name: Build (${{ matrix.make_target }})
        run: make ${{ matrix.make_target }}

      # NOTE: CMAKE_RUNTIME_OUTPUT_DIRECTORY is pinned to
      # ${CMAKE_SOURCE_DIR}/bin in CMakeLists.txt — i.e. always
      # dkrixserver/bin/, regardless of which build-* directory
      # configured it. Each matrix leg gets a fresh runner/checkout, so
      # there's no cross-leg clobbering, but the binary path itself
      # does NOT vary by sanitizer the way the build-<san> dir does.
      - name: Verify binaries exist
        run: |
          set -e
          for b in gameserver loginserver sharedserver; do
            if [ ! -f "bin/$b" ]; then
              echo "::error::Expected binary bin/$b was not produced"
              exit 1
            fi
            echo "ok: bin/$b"
          done

  boot-asan:
    # WHAT THIS JOB IS, HONESTLY: it boots the three servers under
    # AddressSanitizer against a freshly seeded MySQL and asserts each one
    # reaches its listening socket with no sanitizer report. That is all.
    # It does NOT log in, does NOT send a packet, and does NOT exercise a
    # single handler.
    #
    # It exists because the `sanitizers` matrix above is build-only, and a
    # build-only ASan job cannot catch anything ASan is for — ASan reports
    # at runtime. Two green ASan builds sat in CI while every login
    # segfaulted (docs/SECURITY-AUDIT-2026-08-10.md §4).
    #
    # Boot is not a small slice of this tree. Of the fourteen Phase 18
    # bugs, five fire before the listening socket: 18-A (malformed SQL
    # literal, killed the gameserver in KeyInfoManager::load()), 18-D
    # (`new char[]` freed with plain `delete` in Zone.cpp), 18-E (4-byte
    # heap overflow in ExpTable on every boot), 18-J (PetAttrInfo writing
    # into unconstructed storage) and 18-L (uninitialised
    # GameServerPlayer* array in the sharedserver). This job would have
    # caught all five. It would have caught none of 18-B, 18-C, 18-G,
    # 18-H, 18-I or 18-N, which all need a client on the wire.
    #
    # The packet driver that would close that gap is specified in
    # docs/ci-runtime-sanitizer-plan.md. It is not implemented.
    name: boot under asan (boot-only, no packets)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # NON-BLOCKING on introduction, same flip rule the sanitizer matrix
    # uses (MODERNIZATION.md Phase 10 bullet 3): becomes blocking after
    # >=5 consecutive green runs of this leg. It has never run. The parts
    # of it that could be tested off a runner were: the boot/wait/assert
    # logic was fault-injected locally on 2026-08-10 (server dies before
    # binding; sanitizer report present; port already squatted; all-clear)
    # and behaves. What has NOT been tested anywhere is whether the real
    # servers reach a listening socket on a runner at all — in particular
    # whether the gameserver blocks on the billing or log server its conf
    # names, neither of which exists here.
    continue-on-error: true

    services:
      mysql:
        image: mysql:5.7
        env:
          # Local to this ephemeral service container, reachable only from
          # this job, destroyed when the job ends. Not a credential.
          MYSQL_ROOT_PASSWORD: ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libmysqlclient-dev \
            liblua5.1-0-dev \
            libxerces-c-dev \
            libnsl-dev \
            mysql-client

      - name: Cache ASan build tree
        uses: actions/cache@v4
        with:
          path: dkrixserver/build-asan
          key: server-build-asan-${{ runner.os }}-${{ hashFiles('dkrixserver/**/CMakeLists.txt') }}
          restore-keys: server-build-asan-${{ runner.os }}-

      - name: Build (debug-asan)
        working-directory: dkrixserver
        run: make debug-asan

      # Seeds DARKEDEN + USERINFO from dkrixserver/initdb/ — the same
      # dumps docker/docker-compose.yml mounts — and repoints the
      # WorldDBInfo rows, which ship pointing at the compose service name
      # `odk-mysql`.
      - name: Seed database
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          DB_HOST: 127.0.0.1
        run: bash dkrixserver/scripts/ci-boot-smoke.sh seed

      # Materialises conf/*.conf from the tracked *.conf.template files
      # (the real ones are untracked; they carry credentials) and rewrites
      # HomePath to this checkout.
      - name: Write configs
        run: bash dkrixserver/scripts/ci-boot-smoke.sh conf

      - name: Boot all three under ASan
        env:
          DKRIX_DB_HOST: 127.0.0.1
          DKRIX_DB_USER: elcastle
          DKRIX_DB_PASSWORD: elca110
          DKRIX_UI_DB_HOST: 127.0.0.1
          DKRIX_UI_DB_USER: elcastle
          DKRIX_UI_DB_PASSWORD: elca110
          DKRIX_DIST_DB_HOST: 127.0.0.1
          DKRIX_DIST_DB_USER: elcastle
          DKRIX_DIST_DB_PASSWORD: elca110
          DKRIX_LOGIN_SERVER_IP: 127.0.0.1
          DKRIX_SHARED_SERVER_IP: 127.0.0.1
          DKRIX_BILLING_SERVER_IP: 127.0.0.1
          DKRIX_LOG_SERVER_IP: 127.0.0.1
          DKRIX_MONITOR_CLIENT_IP1: 127.0.0.1
          DKRIX_MONITOR_CLIENT_IP2: 127.0.0.1
          BOOT_TIMEOUT: 420
        run: bash dkrixserver/scripts/ci-boot-smoke.sh boot

      - name: Upload server and sanitizer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-asan-logs
          path: dkrixserver/ci-boot-logs/
          if-no-files-found: warn
          retention-days: 14

  format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned 2026-08-07. Unpinned apt made this gate nondeterministic:
      # the runner image's clang-format is 18.1.3, which formats two
      # CJK-comment quest files differently from every later version
      # (18.1.8 / 19.1.7 / 20.1.7 / 22.1.8 all agree with each other and
      # accept the tree as committed — measured, runs #6/#7/#9). Match it
      # locally with: pip install clang-format==18.1.8
      - name: Install clang-format (pinned)
        run: |
          sudo pip install --break-system-packages clang-format==18.1.8
          which clang-format
          clang-format --version

      # Changed LINES, not changed files [2026-08-10] — adopting the same
      # tools/ci/clang-format-changed-lines.sh the client gate has used
      # since 2026-08-09.
      #
      # The whole-file form this replaces was a tax on touching legacy
      # code: Zone.cpp carried 535 pre-existing violations and
      # CLSelectPCHandler 16, so a three-line use-after-free fix demanded a
      # 1,188-line reformat first. That is exactly backwards — it makes the
      # cheapest safety fix the most expensive one, and it cost this branch
      # two separate format-only commits (3ca03fe, c8fbd67).
      #
      # This is not a weaker gate for new code: every line the change
      # actually adds or edits is still required to be clang-format clean,
      # and the script refuses to pass when a non-empty change list
      # inspects nothing. What it stops doing is charging an author for
      # drift that was already in the file.
      #
      # The clang-format==18.1.8 pin above is load-bearing and must stay.
      - name: Check changed C++ lines
        run: |
          # Base selection [fixed 2026-08-09] — same bug and same fix as
          # client.yml. On a push the range is github.event.before..HEAD, the
          # whole push; the old HEAD~1 fallback inspected only the tip commit,
          # so a multi-commit push ending on a docs-only commit skipped every
          # source file it touched and passed green. `before` falls back to
          # HEAD~1 in three cases: absent on workflow_dispatch, all-zeros on a
          # branch's first push, unreachable after a force-push.
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="${{ github.event.before }}"; fi
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then base=""; fi
          if [ -n "$base" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::notice::base $base is not reachable (force-push?); falling back to HEAD~1"
            base=""
          fi
          if [ -z "$base" ]; then base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"; fi
          echo "Comparing $base..HEAD"

          changed=$(git diff --name-only --diff-filter=ACM "$base" HEAD \
            | grep -E '^dkrixserver/.*\.(cpp|h|hpp)$' || true)

          if [ -z "$changed" ]; then
            echo "No server C++ files changed."
            exit 0
          fi

          # Paths here are repo-relative and this step runs from the repo
          # root (there is deliberately no workflow-level working-directory
          # — see the NOTE at the top of this file), so they resolve as-is.
          echo "$changed" | BASE="$base" bash tools/ci/clang-format-changed-lines.sh "server C++ file(s)"

  ratchets:
    name: ratchets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Lifted from the parked line's Phase 8C / Phase 12.0 gates
    # (archive/modernization-phases-1-17, dkrixserver/scripts/) and
    # re-baselined against this tree, which never ran the migrations
    # that lowered the parked baselines. Both are grep-based ratchets:
    # today's count is frozen in a sibling `.{name}-baseline` file and
    # the job fails only if a change pushes the count ABOVE it.
    # Lowering the count (migrating sites away) is always allowed and
    # should be followed by re-running the script with --update.
    steps:
      - uses: actions/checkout@v4
        # No fetch-depth override: both scripts grep the working tree
        # as checked out and never walk git history, so the default
        # shallow (depth 1) checkout is sufficient.

      # Run via `sh`, not executed directly off the shebang. This repo
      # is authored on a Windows workstation with core.fileMode=false,
      # so the executable bit does not reliably survive `git add` —
      # every other *.sh file already in this tree (e.g.
      # dkrixserver/docker/start-servers.sh, which its own Dockerfile
      # re-chmods after COPY) is 100644 in HEAD despite being run as a
      # script. `sh script.sh` works regardless of the stored mode.

      # Phase 8C ratchet. Counts every site where the SQL text handed to
      # MySQL is assembled at runtime, in three separately-ratcheted
      # categories: `format` (a variadic API vsprintf's caller values into
      # the SQL), `stream` (StringStream + operator<< + .toString()), and
      # `splice` (a C++ expression concatenated into the SQL text).
      #
      # Baseline 70/24/164 = 258 [measured 2026-08-10]. The previous
      # revision counted only `format` and reported 70 while 188
      # stream/splice sites sat next to it unseen — 41 of them in
      # loginserver/ItemDestroyer.cpp, each splicing an ownerID straight
      # into a quoted SQL literal. The `format` set is unchanged and
      # byte-for-byte identical to what that revision reported; the other
      # two categories are new coverage, not a re-interpretation.
      - name: SQL-injection ratchet
        run: sh dkrixserver/scripts/check-sql-injection.sh

      # SQL literal syntax gate [new 2026-08-10]. Concatenates the adjacent
      # string literals of every SQL call site exactly as the compiler
      # would and checks the result: fused statements, keywords glued to
      # the preceding word, stray `;`, missing statement verb, unbalanced
      # parens/quotes, quoted `?`, and placeholder/bind-index mismatch.
      #
      # This is the gate whose absence let Bug 18-A ship — two SQL
      # statements fused into one literal, which meant the gameserver
      # could not boot at all for a day. Verified against that exact
      # defect: run over `git show 9422e9c^:.../item/Key.cpp` it reports
      # three independent errors and exits 1.
      #
      # Not a ratchet. Every finding is a real defect, so it fails on the
      # first one.
      - name: SQL literal syntax lint
        run: sh dkrixserver/scripts/check-sql-literals.sh

      # Phase 12.0 ratchet. Counts filename-identical packet classes
      # duplicated between dkrixserver/src/Core/ and
      # dkrix/Client/Packet/Cpackets/. Baseline 326, measured fresh for
      # this tree — every packet file in Cpackets currently has a
      # same-named server-side sibling, since the shared/Packets/
      # migrations (Phase 12) that drove the parked line's baseline
      # toward 0 do not exist here.
      - name: Packet-duplicates ratchet
        run: sh dkrixserver/scripts/check-packet-duplicates.sh
