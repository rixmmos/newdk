name: Server (dkrixserver)

# Builds the Linux server tree. This is the authoritative server
# verification path from the workspace-root CLAUDE.md, run on every push instead of
# only on this workstation.

# Trigger policy [changed 2026-08-10]. The branch allowlist was
# [main, "modernize/**"]. `fix/bug-18b-loginserver-result-uaf` matched
# neither and no PR existed, so all 27 commits of the Phase 18 security
# work — every one of them a fix to a crash or a memory-safety defect —
# were never built by CI at all. Two format-only commits were written on
# that branch to satisfy a gate that never ran.
#
# The allowlist is now gone rather than extended with `fix/**`. Adding a
# pattern only moves the trap: the next branch prefix nobody thought of
# fails exactly the same way, silently, and the failure is invisible
# precisely when it matters (a branch created in a hurry to fix
# something). This repo is public, so Actions minutes are free, and the
# `paths:` filter below still skips docs-only pushes. Running on every
# branch costs runner time; not running is how 27 unbuilt commits happen.
on:
  push:
    paths:
      - "dkrixserver/**"
      - ".github/workflows/server.yml"
      - "tools/ci/**"
      # Compiled into all three servers via dkrixserver/CMakeLists.txt's
      # add_subdirectory. Omitting it meant a change confined to
      # shared/Packets/ triggered NO server CI -- the same shape as the
      # branch-allowlist trap described above.
      - "shared/Packets/**"
      # The packet-duplicates ratchet reads this client dir too; without
      # this filter a client-side packet add would skip the gate.
      - "dkrix/Client/Packet/Cpackets/**"
  pull_request:
    branches: [main]
    paths:
      - "dkrixserver/**"
      - ".github/workflows/server.yml"
      - "tools/ci/**"
      - "shared/Packets/**"
      - "dkrix/Client/Packet/Cpackets/**"
  # Push-triggered runs have lagged 20+ minutes; workflow_dispatch returns
  # in seconds. Keep it on every workflow.
  workflow_dispatch:

# NOTE: working-directory is set per-job, NOT at workflow level. A workflow-level
# default also applies to the `format` job, where it silently breaks the check:
# `git diff --name-only` always prints repo-relative paths (dkrixserver/src/...),
# so the subsequent `[ -f "$f" ]` test runs from inside dkrixserver/ and looks for
# dkrixserver/dkrixserver/src/... — never found, every file skipped via `continue`,
# and the job passes green having checked nothing.

jobs:
  build:
    name: make debug (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: dkrixserver

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libmysqlclient-dev \
            liblua5.1-0-dev \
            libxerces-c-dev \
            libnsl-dev
        # libnsl-dev: all three server targets link -lnsl
        # (src/server/{gameserver,loginserver,sharedserver}/CMakeLists.txt,
        # EXTRA_LIBS under the elseif(UNIX) branch). libnsl was split out of
        # glibc in 2.32 and is NOT preinstalled on ubuntu-latest, so the link
        # step failed with "ld: cannot find -lnsl" after compiling to 86%.
        # First real CI failure, 2026-08-06.

      - name: Show toolchain
        run: |
          cmake --version
          g++ --version
          pkg-config --modversion xerces-c || true

      - name: Cache build tree
        uses: actions/cache@v4
        with:
          path: dkrixserver/build
          key: server-build-${{ runner.os }}-${{ hashFiles('dkrixserver/**/CMakeLists.txt') }}
          restore-keys: server-build-${{ runner.os }}-

      # The Makefile wraps CMake: `make debug` == cmake -B build
      # -DCMAKE_BUILD_TYPE=Debug && cmake --build build.
      - name: Build (Debug)
        run: make debug

      - name: Verify binaries exist
        run: |
          set -e
          for b in gameserver loginserver sharedserver; do
            if [ ! -f "bin/$b" ]; then
              echo "::error::Expected binary bin/$b was not produced"
              exit 1
            fi
            echo "ok: bin/$b"
          done

  sanitizers:
    # Additive leg, does not replace the plain `build` job above — same
    # dependency set, invoking the debug-asan / debug-ubsan Makefile
    # targets added alongside the CMakeLists.txt USE_<SAN> options
    # (Phase 10 bullet 3, 2026-08-07). TSan is deliberately excluded
    # from the matrix, same rationale as the parked line's Phase 15D
    # (archive/modernization-phases-1-17, 56f4165): the server's thread
    # model has not been audited and TSan on un-audited code produces
    # more false-positive noise than signal until real races are
    # addressed. `make debug-tsan` still works locally.
    #
    # This sanitizer matrix has never been run against this tree before
    # — CI is the actual gate for whether -fsanitize=address/undefined
    # compiles and links clean here, not this review.
    name: build (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Per-leg blocking, driven by `matrix.non_blocking` below. Both legs
    # started non-blocking (2026-08-07): neither had ever run, and the
    # plain `make debug` job above is what stayed red twice that day
    # (ff96e46, 421088e) before finally going green — an untested
    # sanitizer leg shouldn't be able to flip the whole workflow red
    # while it's still finding its feet.
    #
    # The flip rule (MODERNIZATION.md Phase 10 bullet 3): a leg becomes
    # blocking after ≥5 consecutive green runs of that leg. `asan`
    # reached that on 2026-08-09 and is now blocking; `ubsan` has never
    # been green and stays non-blocking. See the per-leg comments in the
    # matrix `include:` entries.
    continue-on-error: ${{ matrix.non_blocking }}
    defaults:
      run:
        working-directory: dkrixserver

    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, ubsan]
        include:
          # BLOCKING since 2026-08-09. [measured, job-level, Actions API]
          # `build (asan)` green on server runs #27 (c91eebb) → #31
          # (cc4ea8ba) — five consecutive. Over the leg's whole life
          # (#15 eb9fd2d1 onward) it is 13 green / 4 red, and all four
          # reds — #17, #19, #25, #26 — are runs where the plain
          # `make debug (ubuntu)` job was red too, i.e. the tree was
          # compile-broken for everyone. -fsanitize=address has never
          # failed on its own here.
          - sanitizer: asan
            make_target: debug-asan
            non_blocking: false
          # NON-BLOCKING, and staying that way for now. [measured]
          # `build (ubsan)` has failed its own `make debug-ubsan` step on
          # every run it has ever had — #15 (eb9fd2d1) through #31
          # (cc4ea8ba), 17 for 17, including the 13 runs where both the
          # plain build and the asan leg were green.
          #
          # The cause is now understood and fixed: the link died on three
          # `typeinfo for GC*` symbols that -fsanitize=vptr invents, and
          # dkrixserver/CMakeLists.txt now appends -fno-sanitize=vptr.
          # Full diagnosis in docs/ci-server-ubsan.md.
          #
          # It does NOT become blocking on the strength of that. The rule
          # this repo already uses (MODERNIZATION.md Phase 10 bullet 3, and
          # the asan entry above) is >=5 consecutive green runs of the leg
          # itself, and the counter here is still 0 — the fix was verified
          # in one local WSL build, not on a runner, and this leg has never
          # produced a single green. Flip it after five, same as asan.
          - sanitizer: ubsan
            make_target: debug-ubsan
            non_blocking: true

    steps:
      - uses: actions/checkout@v4

      # Same dependency set as the `build` job above.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libmysqlclient-dev \
            liblua5.1-0-dev \
            libxerces-c-dev \
            libnsl-dev

      - name: Show toolchain
        run: |
          cmake --version
          g++ --version

      - name: Build (${{ matrix.make_target }})
        run: make ${{ matrix.make_target }}

      # NOTE: CMAKE_RUNTIME_OUTPUT_DIRECTORY is pinned to
      # ${CMAKE_SOURCE_DIR}/bin in CMakeLists.txt — i.e. always
      # dkrixserver/bin/, regardless of which build-* directory
      # configured it. Each matrix leg gets a fresh runner/checkout, so
      # there's no cross-leg clobbering, but the binary path itself
      # does NOT vary by sanitizer the way the build-<san> dir does.
      - name: Verify binaries exist
        run: |
          set -e
          for b in gameserver loginserver sharedserver; do
            if [ ! -f "bin/$b" ]; then
              echo "::error::Expected binary bin/$b was not produced"
              exit 1
            fi
            echo "ok: bin/$b"
          done

  warning-scan:
    # WHY THIS JOB EXISTS [new 2026-08-11].
    #
    # `-Wmaybe-uninitialized` cannot fire in any configuration this project
    # builds. CMAKE_CXX_FLAGS_DEBUG is "-g" with no -O flag
    # (dkrixserver/CMakeLists.txt:35), GCC's uninitialised analysis is a
    # dataflow pass that only runs under optimisation, and every Makefile
    # target — debug, debug-asan, debug-tsan, debug-ubsan — is
    # CMAKE_BUILD_TYPE=Debug. So is every job above. A real Debug build log
    # shows 31 warnings, none containing "uninitialized"
    # (MODERNIZATION.md, "Why the uninitialised-variable class keeps
    # recurring" [measured]).
    #
    # Six Phase 18 bugs share that root — 18-F (uninitialised member
    # pointers delete[]'d), 18-L (uninitialised player array dereferenced),
    # 18-M(b), 18-W (three uninitialised Statement* reaching delete), 18-AA,
    # 18-AI (two uninitialised QuestID_t erasing arbitrary quests). Every one
    # was found by a person reading code, because the compiler was
    # structurally unable to say anything. This job gives the compiler the
    # one thing it was missing: an -O flag.
    #
    # WHY A SEPARATE LEG RATHER THAN -Og IN CMAKE_CXX_FLAGS_DEBUG.
    # `make debug` is what runs in production here — the deployed binaries
    # are the Debug ones (dkrixserver/CLAUDE.md is explicit that Assert() is
    # live precisely because Debug does not set NDEBUG). Putting -Og there
    # changes the codegen of the shipping server, and of the asan/ubsan/boot
    # legs with it, as a side effect of a diagnostics change. On a tree whose
    # UB inventory is literally unknown (no UBSan-instrumented binary has
    # ever been executed here — see the boot matrix) optimisation is not a
    # behaviour-neutral edit. And the payoff would be identical anyway:
    # nothing in this repo builds with -Werror, so -Og in Debug would print
    # warnings and gate nothing — exactly what this job does, minus the risk.
    # The one thing the -Og route buys that this does not is putting the
    # warning in front of a developer at their own terminal; the step summary
    # below is the substitute, and it is a weaker one. Revisit if this leg
    # produces findings nobody reads.
    #
    # NOT CACHED, DELIBERATELY. Every other build leg caches its build tree.
    # This one must not: an incremental build recompiles only what changed
    # and therefore re-emits warnings only for what changed, so a cache hit
    # would silently turn a 400-warning inventory into "3 warnings" and read
    # as an improvement. That is the same failure shape as the SQL ratchet
    # reporting 0 while 188 sites were invisible to it. A warning scan is
    # only meaningful over a full compile, so it pays for one every run.
    #
    # This leg produces NO deliverable. It does not verify binaries and
    # uploads none. (CMAKE_RUNTIME_OUTPUT_DIRECTORY is pinned to
    # ${CMAKE_SOURCE_DIR}/bin, so the -O2 executables do land in
    # dkrixserver/bin/ — on a fresh runner, discarded with the job. Nothing
    # downstream reads them, and nothing should: they are not the shipped
    # configuration.)
    name: warning scan (-O2, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # NON-BLOCKING, and unlike the sanitizer legs there is no plan to flip
    # it. The repo's flip rule (MODERNIZATION.md Phase 10 bullet 3) is >=5
    # consecutive greens of a leg, but that rule is for legs that assert
    # something. This one reports a count. It becomes enforceable only by
    # being turned into a ratchet — see "SEEDING A RATCHET" below — and not
    # before a real run has produced a real number.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      # Same dependency set as every other build leg, libnsl-dev included:
      # this job links the three executables like the others do, so it hits
      # the same `ld: cannot find -lnsl` at 86% without it. It links only
      # because CMake's default target does; the binaries are unused.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libmysqlclient-dev \
            liblua5.1-0-dev \
            libxerces-c-dev \
            libnsl-dev

      - name: Show toolchain
        run: |
          cmake --version
          g++ --version

      # FLAG INJECTION, AND WHY IT GOES IN CMAKE_CXX_FLAGS AND NOT
      # CMAKE_CXX_FLAGS_DEBUG. CMakeLists.txt:35 is a plain
      # `set(CMAKE_CXX_FLAGS_DEBUG "-g")`, which overrides the cache — a
      # -DCMAKE_CXX_FLAGS_DEBUG=... on the command line is silently
      # discarded. (Same trap documented at CMakeLists.txt:93-97 for the
      # UBSan flags.) CMAKE_CXX_FLAGS is only ever appended to, so it
      # survives. Resulting compile line, in order:
      #   <-O2 …>  -g  -Wall -Wno-format -Wno-format-security
      # i.e. CMAKE_CXX_FLAGS, then CMAKE_CXX_FLAGS_DEBUG, then the
      # add_compile_options set. Nothing later carries an -O, so -O2 stands.
      #
      # Build type stays Debug ON PURPOSE. Release would add -DNDEBUG, which
      # compiles Assert() down to ((void)0) (src/Core/Assert.h) and deletes
      # whole branches from the dataflow the analysis walks. The point is to
      # analyse the configuration that ships, with optimisation added — not a
      # different configuration.
      #
      # -O2 rather than -Og: more inlining means more interprocedural
      # dataflow means more findings, and since this build ships nothing,
      # none of the -Og-preserves-debuggability argument applies here.
      #
      # The four explicit -W flags: -Wuninitialized/-Wmaybe-uninitialized are
      # already in -Wall and are restated because they are the reason this
      # job exists. -Wnull-dereference is NOT in -Wall and also needs
      # optimisation. -Winit-self catches `int x = x;`. No `=level` suffixes
      # are used: -Wall re-enables its constituents at its own default level
      # and would fight an earlier explicit level.
      - name: Configure and build at -O2
        working-directory: dkrixserver
        run: |
          set -o pipefail
          mkdir -p ci-warning-logs
          cmake -B build-warnings \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-O2 -Wuninitialized -Wmaybe-uninitialized -Winit-self -Wnull-dereference"
          status=0
          cmake --build build-warnings -j"$(nproc)" 2>&1 \
            | tee ci-warning-logs/build.log || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::the -O2 scan build did not complete (exit $status) — the report below covers only the translation units that compiled"
          fi
          # Deliberately does not propagate $status. A -O2 build breaking
          # where the Debug build does not is a finding in its own right, and
          # it is recorded by the ::warning:: above and by the uploaded log;
          # it must not cost us the partial warning inventory.

      # Report is line-oriented on purpose: a parallel build interleaves
      # output, so multi-line diagnostic context (the source excerpt, the
      # "note:" follow-ups) cannot be reassembled reliably — but the
      # `file:line:col: warning: … [-Wopt]` line itself is atomic.
      #
      # Two numbers are produced. The FAMILY count is the one that matters:
      # the optimisation-dependent diagnostics, i.e. the ones the Debug legs
      # are structurally unable to emit. They map onto the Phase 18 inventory
      # directly — uninitialized/init-self (18-F, 18-L, 18-M(b), 18-W, 18-AA,
      # 18-AI), use-after-free/dangling-pointer (18-B, the branch this landed
      # on), array-bounds/stringop-* (18-E, a 4-byte heap overflow on every
      # boot), mismatched-new-delete/free-nonheap-object (18-D, `new char[]`
      # freed with plain `delete`).
      #
      # The TOTAL count is context only, and is expected to be large and
      # mostly -Wunused-variable / -Wparentheses / -Wdeprecated-declarations
      # noise on a 1.29M-LOC 2000s-era tree. It is reported so that the
      # family count can be read as a fraction rather than in a vacuum, and
      # so a sudden collapse in it (a cache slipping in, a build dying early)
      # is visible rather than looking like progress.
      #
      # Both are deduplicated: a warning in a header is re-emitted once per
      # translation unit that includes it, and this tree has headers included
      # hundreds of times. Raw counts would be dominated by include fan-out.
      - name: Report optimisation-dependent warnings
        if: always()
        working-directory: dkrixserver
        run: |
          log=ci-warning-logs/build.log
          if [ ! -s "$log" ]; then
            echo "::warning::no build log was produced; nothing to report"
            exit 0
          fi

          # Strip the runner-specific path prefix so the report is stable
          # across runs and diffable by eye between branches.
          grep -E ' warning: ' "$log" \
            | sed -e "s#${GITHUB_WORKSPACE}/##g" -e 's#^ *##' \
            | sort -u > ci-warning-logs/all-warnings.txt

          family='\[-W(maybe-uninitialized|uninitialized|init-self|null-dereference|array-bounds[^]]*|stringop-(overflow|overread|truncation)[^]]*|use-after-free[^]]*|dangling-pointer[^]]*|mismatched-new-delete|free-nonheap-object|return-local-addr|alloc-size-larger-than[^]]*|restrict)\]'
          grep -E "$family" ci-warning-logs/all-warnings.txt \
            > ci-warning-logs/family-warnings.txt || true

          total=$(wc -l < ci-warning-logs/all-warnings.txt)
          fam=$(wc -l < ci-warning-logs/family-warnings.txt)

          {
            echo "## Optimisation-dependent warnings (-O2, Debug config)"
            echo
            echo "| | count (unique) |"
            echo "|---|---|"
            echo "| **Uninit / lifetime / bounds family** | **${fam}** |"
            echo "| All warnings | ${total} |"
            echo
            echo "This leg is informational and cannot fail the workflow."
            echo "The Debug legs above emit **none** of the family warnings —"
            echo "not because they are absent, but because \`-g\` with no \`-O\`"
            echo "cannot run the dataflow pass that finds them."
            echo
            echo "### By diagnostic"
            echo
            echo '```'
            grep -oE '\[-W[a-zA-Z0-9=_-]+\]' ci-warning-logs/all-warnings.txt \
              | sort | uniq -c | sort -rn | head -40
            echo '```'
            echo
            echo "### Family findings"
            echo
            if [ "$fam" -eq 0 ]; then
              echo "None. Treat with suspicion on a first run — check the"
              echo "\`by diagnostic\` block above actually lists something,"
              echo "and that the build reached the end."
            else
              echo '```'
              head -200 ci-warning-logs/family-warnings.txt
              echo '```'
              if [ "$fam" -gt 200 ]; then
                echo
                echo "_… ${fam} total; full list in the \`server-warning-scan\` artifact._"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "family=${fam} total=${total}"

          # SEEDING A RATCHET — the intended follow-up, deliberately NOT done
          # here. No number is committed today because no run has happened
          # and a guessed baseline is worse than none: too high and it never
          # bites, too low and it fails green trees on arrival. After the
          # first full run on `main`, take the FAMILY count from this step,
          # commit it as dkrixserver/scripts/.warning-scan-baseline, and add
          # a compare here that fails when the count rises — same shape and
          # same `--update` discipline as check-sql-injection.sh and
          # check-packet-duplicates.sh. Ratchet the family count only. The
          # total is noise and ratcheting it would just tax anyone who adds a
          # file.

      - name: Upload warning scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-warning-scan
          path: |
            dkrixserver/ci-warning-logs/all-warnings.txt
            dkrixserver/ci-warning-logs/family-warnings.txt
            dkrixserver/ci-warning-logs/build.log
          if-no-files-found: warn
          retention-days: 14

  boot:
    # WHAT THIS JOB IS, HONESTLY: it boots the three servers under a
    # sanitizer against a freshly seeded MySQL and asserts each one
    # reaches its listening socket with no sanitizer report. That is all.
    # It does NOT log in, does NOT send a packet, and does NOT exercise a
    # single handler.
    #
    # It exists because the `sanitizers` matrix above is build-only, and a
    # build-only sanitizer job cannot catch anything a sanitizer is for —
    # they report at runtime. Two green ASan builds sat in CI while every
    # login segfaulted (docs/SECURITY-AUDIT-2026-08-10.md §4). The ubsan
    # leg of that matrix has exactly the same shape of hole, which is why
    # it gets a boot leg here the moment it can link at all: a green
    # `build (ubsan)` on its own would prove only that the tree compiles
    # under UBSan, and UBSan finds nothing at compile time.
    #
    # Boot is not a small slice of this tree. Of the fourteen Phase 18
    # bugs, five fire before the listening socket: 18-A (malformed SQL
    # literal, killed the gameserver in KeyInfoManager::load()), 18-D
    # (`new char[]` freed with plain `delete` in Zone.cpp), 18-E (4-byte
    # heap overflow in ExpTable on every boot), 18-J (PetAttrInfo writing
    # into unconstructed storage) and 18-L (uninitialised
    # GameServerPlayer* array in the sharedserver). This job would have
    # caught all five. It would have caught none of 18-B, 18-C, 18-G,
    # 18-H, 18-I or 18-N, which all need a client on the wire.
    #
    # The packet driver that would close that gap is specified in
    # docs/ci-runtime-sanitizer-plan.md. It is not implemented.
    #
    # The sanitizer is a matrix axis rather than a copied job:
    # ci-boot-smoke.sh is sanitizer-agnostic (it detects a finding by the
    # presence of a report file, not by a dead process or an exit code),
    # so the only per-leg differences are the make target, the build-dir
    # cache key, and the artifact name. Duplicating ~90 lines of MySQL
    # service + seed + conf + env to change three strings is how the two
    # copies drift.
    name: boot under ${{ matrix.sanitizer }} (boot-only, no packets)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # NON-BLOCKING, per-leg, same flip rule as the sanitizer matrix
    # (MODERNIZATION.md Phase 10 bullet 3): a leg becomes blocking after
    # >=5 consecutive green runs of that leg. See the matrix entries.
    continue-on-error: ${{ matrix.non_blocking }}

    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, ubsan]
        include:
          # The boot/wait/assert logic was fault-injected locally on
          # 2026-08-10 (server dies before binding; sanitizer report
          # present; port already squatted; all-clear) and behaves, and a
          # full end-to-end run passed locally the same day. On a runner
          # it is still young — consecutive greens well under 5.
          - sanitizer: asan
            make_target: debug-asan
            non_blocking: true
          # UBSan boot [new]. Strictly more speculative than the asan leg:
          # no UBSan-instrumented server binary has ever been EXECUTED
          # anywhere, so what it reports at runtime is completely unknown,
          # and a 2000s-era C++ tree is likely to produce a substantial
          # first inventory (signed overflow, misaligned loads, null
          # `this`). That inventory is the point of the leg; it is also
          # exactly why it must not be able to fail the workflow.
          #
          # UBSan reports and CONTINUES by default, and ci-boot-smoke.sh
          # keeps that (halt_on_error=0 — reasoning in do_boot() there), so
          # one run enumerates every distinct site rather than stopping at
          # the first. The job still fails on any finding: detection is by
          # report file, not by exit status.
          - sanitizer: ubsan
            make_target: debug-ubsan
            non_blocking: true

    services:
      mysql:
        image: mysql:5.7
        env:
          # Local to this ephemeral service container, reachable only from
          # this job, destroyed when the job ends. Not a credential.
          MYSQL_ROOT_PASSWORD: ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libmysqlclient-dev \
            liblua5.1-0-dev \
            libxerces-c-dev \
            libnsl-dev \
            mysql-client \
            llvm
        # llvm: for llvm-symbolizer. Both runtimes are asked for stack
        # traces below (ASAN_OPTIONS symbolize/print_stacktrace,
        # UBSAN_OPTIONS print_stacktrace) and without a symbolizer on PATH
        # GCC's libsanitizer emits raw addresses, which makes a finding
        # nearly unactionable from a log artifact. Cheap insurance on a
        # leg whose entire output is those reports.

      - name: Cache ${{ matrix.sanitizer }} build tree
        uses: actions/cache@v4
        with:
          path: dkrixserver/build-${{ matrix.sanitizer }}
          key: server-build-${{ matrix.sanitizer }}-${{ runner.os }}-${{ hashFiles('dkrixserver/**/CMakeLists.txt') }}
          restore-keys: server-build-${{ matrix.sanitizer }}-${{ runner.os }}-

      - name: Build (${{ matrix.make_target }})
        working-directory: dkrixserver
        run: make ${{ matrix.make_target }}

      # Seeds DARKEDEN + USERINFO from dkrixserver/initdb/ — the same
      # dumps docker/docker-compose.yml mounts — and repoints the
      # WorldDBInfo rows, which ship pointing at the compose service name
      # `odk-mysql`.
      - name: Seed database
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          DB_HOST: 127.0.0.1
        run: bash dkrixserver/scripts/ci-boot-smoke.sh seed

      # Materialises conf/*.conf from the tracked *.conf.template files
      # (the real ones are untracked; they carry credentials) and rewrites
      # HomePath to this checkout.
      - name: Write configs
        run: bash dkrixserver/scripts/ci-boot-smoke.sh conf

      - name: Boot all three under ${{ matrix.sanitizer }}
        env:
          DKRIX_DB_HOST: 127.0.0.1
          DKRIX_DB_USER: elcastle
          DKRIX_DB_PASSWORD: password
          DKRIX_UI_DB_HOST: 127.0.0.1
          DKRIX_UI_DB_USER: elcastle
          DKRIX_UI_DB_PASSWORD: password
          DKRIX_DIST_DB_HOST: 127.0.0.1
          DKRIX_DIST_DB_USER: elcastle
          DKRIX_DIST_DB_PASSWORD: password
          DKRIX_LOGIN_SERVER_IP: 127.0.0.1
          DKRIX_SHARED_SERVER_IP: 127.0.0.1
          DKRIX_BILLING_SERVER_IP: 127.0.0.1
          DKRIX_LOG_SERVER_IP: 127.0.0.1
          DKRIX_MONITOR_CLIENT_IP1: 127.0.0.1
          DKRIX_MONITOR_CLIENT_IP2: 127.0.0.1
          BOOT_TIMEOUT: 420
          # Report-and-continue (the UBSan default). Ignored by the asan
          # leg. Set to 1 only to bisect a cascade where one early finding
          # buries the rest — see do_boot() in ci-boot-smoke.sh.
          UBSAN_HALT_ON_ERROR: 0
        run: bash dkrixserver/scripts/ci-boot-smoke.sh boot

      - name: Upload server and sanitizer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-${{ matrix.sanitizer }}-logs
          path: dkrixserver/ci-boot-logs/
          if-no-files-found: warn
          retention-days: 14

  format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned 2026-08-07. Unpinned apt made this gate nondeterministic:
      # the runner image's clang-format is 18.1.3, which formats two
      # CJK-comment quest files differently from every later version
      # (18.1.8 / 19.1.7 / 20.1.7 / 22.1.8 all agree with each other and
      # accept the tree as committed — measured, runs #6/#7/#9). Match it
      # locally with: pip install clang-format==18.1.8
      - name: Install clang-format (pinned)
        run: |
          sudo pip install --break-system-packages clang-format==18.1.8
          which clang-format
          clang-format --version

      # Changed LINES, not changed files [2026-08-10] — adopting the same
      # tools/ci/clang-format-changed-lines.sh the client gate has used
      # since 2026-08-09.
      #
      # The whole-file form this replaces was a tax on touching legacy
      # code: Zone.cpp carried 535 pre-existing violations and
      # CLSelectPCHandler 16, so a three-line use-after-free fix demanded a
      # 1,188-line reformat first. That is exactly backwards — it makes the
      # cheapest safety fix the most expensive one, and it cost this branch
      # two separate format-only commits (3ca03fe, c8fbd67).
      #
      # This is not a weaker gate for new code: every line the change
      # actually adds or edits is still required to be clang-format clean,
      # and the script refuses to pass when a non-empty change list
      # inspects nothing. What it stops doing is charging an author for
      # drift that was already in the file.
      #
      # The clang-format==18.1.8 pin above is load-bearing and must stay.
      - name: Check changed C++ lines
        run: |
          # Base selection [fixed 2026-08-09] — same bug and same fix as
          # client.yml. On a push the range is github.event.before..HEAD, the
          # whole push; the old HEAD~1 fallback inspected only the tip commit,
          # so a multi-commit push ending on a docs-only commit skipped every
          # source file it touched and passed green. `before` falls back to
          # HEAD~1 in three cases: absent on workflow_dispatch, all-zeros on a
          # branch's first push, unreachable after a force-push.
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="${{ github.event.before }}"; fi
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then base=""; fi
          if [ -n "$base" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::notice::base $base is not reachable (force-push?); falling back to HEAD~1"
            base=""
          fi
          if [ -z "$base" ]; then base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"; fi
          echo "Comparing $base..HEAD"

          changed=$(git diff --name-only --diff-filter=ACM "$base" HEAD \
            | grep -E '^dkrixserver/.*\.(cpp|h|hpp)$' || true)

          if [ -z "$changed" ]; then
            echo "No server C++ files changed."
            exit 0
          fi

          # Paths here are repo-relative and this step runs from the repo
          # root (there is deliberately no workflow-level working-directory
          # — see the NOTE at the top of this file), so they resolve as-is.
          echo "$changed" | BASE="$base" bash tools/ci/clang-format-changed-lines.sh "server C++ file(s)"

  ratchets:
    name: ratchets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Lifted from the parked line's Phase 8C / Phase 12.0 gates
    # (archive/modernization-phases-1-17, dkrixserver/scripts/) and
    # re-baselined against this tree, which never ran the migrations
    # that lowered the parked baselines. Both are grep-based ratchets:
    # today's count is frozen in a sibling `.{name}-baseline` file and
    # the job fails only if a change pushes the count ABOVE it.
    # Lowering the count (migrating sites away) is always allowed and
    # should be followed by re-running the script with --update.
    steps:
      - uses: actions/checkout@v4
        # No fetch-depth override: both scripts grep the working tree
        # as checked out and never walk git history, so the default
        # shallow (depth 1) checkout is sufficient.

      # Run via `sh`, not executed directly off the shebang. This repo
      # is authored on a Windows workstation with core.fileMode=false,
      # so the executable bit does not reliably survive `git add` —
      # every other *.sh file already in this tree (e.g.
      # dkrixserver/docker/start-servers.sh, which its own Dockerfile
      # re-chmods after COPY) is 100644 in HEAD despite being run as a
      # script. `sh script.sh` works regardless of the stored mode.

      # Phase 8C ratchet. Counts every site where the SQL text handed to
      # MySQL is assembled at runtime, in three separately-ratcheted
      # categories: `format` (a variadic API vsprintf's caller values into
      # the SQL), `stream` (StringStream + operator<< + .toString()), and
      # `splice` (a C++ expression concatenated into the SQL text).
      #
      # Baseline 70/24/164 = 258 [measured 2026-08-10]. The previous
      # revision counted only `format` and reported 70 while 188
      # stream/splice sites sat next to it unseen — 41 of them in
      # loginserver/ItemDestroyer.cpp, each splicing an ownerID straight
      # into a quoted SQL literal. The `format` set is unchanged and
      # byte-for-byte identical to what that revision reported; the other
      # two categories are new coverage, not a re-interpretation.
      - name: SQL-injection ratchet
        run: sh dkrixserver/scripts/check-sql-injection.sh

      # SQL literal syntax gate [new 2026-08-10]. Concatenates the adjacent
      # string literals of every SQL call site exactly as the compiler
      # would and checks the result: fused statements, keywords glued to
      # the preceding word, stray `;`, missing statement verb, unbalanced
      # parens/quotes, quoted `?`, and placeholder/bind-index mismatch.
      #
      # This is the gate whose absence let Bug 18-A ship — two SQL
      # statements fused into one literal, which meant the gameserver
      # could not boot at all for a day. Verified against that exact
      # defect: run over `git show 9422e9c^:.../item/Key.cpp` it reports
      # three independent errors and exits 1.
      #
      # Not a ratchet. Every finding is a real defect, so it fails on the
      # first one.
      - name: SQL literal syntax lint
        run: sh dkrixserver/scripts/check-sql-literals.sh

      # Phase 12.0 ratchet. Counts filename-identical packet classes
      # duplicated between dkrixserver/src/Core/ and
      # dkrix/Client/Packet/Cpackets/. Baseline 326, measured fresh for
      # this tree — every packet file in Cpackets currently has a
      # same-named server-side sibling, since the shared/Packets/
      # migrations (Phase 12) that drove the parked line's baseline
      # toward 0 do not exist here.
      - name: Packet-duplicates ratchet
        run: sh dkrixserver/scripts/check-packet-duplicates.sh

      # `reserve()`-for-`resize()` ratchet [new 2026-08-13]. Open action 17
      # of docs/SECURITY-AUDIT-2026-08-10.md, and the cheapest gate on that
      # list. Counts every `reserve()` whose container is then indexed,
      # `at()`ed, or walked `begin()`..`end()` without any `resize()`,
      # `assign()` or `push_back()` sizing it first. `reserve()` sets
      # capacity, not size: those writes are out of bounds, the walks are
      # empty, and the code looks like it works because the storage is
      # allocated.
      #
      # Ten call sites of this had to be found by hand across five waves
      # (18-J, 18-P, 18-Q, 18-AL, 18-AR), and five of the six instances the
      # audit names were found only AFTER the pattern had been written
      # down. Verified against exactly those defects: run over the tree at
      # `3e02f6c^`, before the first fix, it reports 17 sites and every
      # historical instance is among them, with no false positives and no
      # false negatives.
      #
      # Baseline 2 [measured 2026-08-13]: `PacketValidator` (real shape,
      # but PLAYER_STATUS_MAX is 0 in all three server binaries) and
      # `UserGateway` (instance 7, found by this gate rather than a human;
      # not in any CMake source list). Both latent, which is the only
      # reason the gate can start green. `reserve()` + `push_back()` is the
      # correct idiom and is never counted.
      - name: reserve()-sizing ratchet
        run: sh dkrixserver/scripts/check-reserve-sizing.sh

      # Guard-indexes-container ratchet [new 2026-08-13]. Section 4 pattern 2
      # of docs/SECURITY-AUDIT-2026-08-10.md. Counts every `Assert(...)`, and
      # every `if (...)` whose whole body is one `return`/`throw`, that tests
      # an indexed element for existence — `Assert(m_pItemInfos[t] != NULL)`.
      # The subscript happens before anything has established the subscript is
      # in range, so the guard IS the out-of-bounds read: it faults instead of
      # catching, and under NDEBUG the Assert form disappears and the caller
      # reads the slot anyway.
      #
      # The audit files this as recurring across 18-K, 18-U, 18-AD, 18-AG,
      # 18-AH, 18-AL and 18-AI — and it recurred again on 2026-08-13, when
      # 18-AW (`b2e7d48`) found `Assert(m_pItemInfos[0] != NULL)` one line
      # below a defect the audit's own §1 row 12 had described without
      # noticing it.
      #
      # Validated against pre-fix trees rather than asserted: the count falls
      # 43 → 42 → 41 → 34 → 27 → 25 across `3e02f6c^`…HEAD, and every one of
      # the 18 drops is a named fix (18-I/18-R Slayer wear slot, 18-U
      # ItemRack, 18-AH SkillDomainInfoManager/VampEXPInfo/OustersEXPInfo,
      # 18-AL InfoClassManager/EventQuestAdvance, 18-AW InfoClassManager::init)
      # or a file deletion. No drop is the checker changing its mind.
      #
      # It covers one sub-shape of pattern 2, not the pattern: 18-K, 18-AD,
      # 18-AG and 18-AI are side-effecting calls inside `Assert` and
      # `Assert(index < MAX)` comparisons, and the gate is correctly silent
      # on all four.
      #
      # Baseline 25 [measured 2026-08-13] — deliberately NOT near zero. §1
      # row 10 records that 18-U's conversions were scoped to wire-reachable
      # checks and that the server-side-index Asserts in `ItemInfoManager`
      # and friends were kept on purpose. Breakdown in the script header.
      - name: Guard-indexes-container ratchet
        run: sh dkrixserver/scripts/check-guard-index.sh
