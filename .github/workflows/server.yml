name: Server (dkrixserver)

# Builds the Linux server tree. This is the authoritative server
# verification path from the workspace-root CLAUDE.md, run on every push instead of
# only on this workstation.

on:
  push:
    branches: [main, "modernize/**"]
    paths:
      - "dkrixserver/**"
      - ".github/workflows/server.yml"
      # The packet-duplicates ratchet reads this client dir too; without
      # this filter a client-side packet add would skip the gate.
      - "dkrix/Client/Packet/Cpackets/**"
  pull_request:
    branches: [main]
    paths:
      - "dkrixserver/**"
      - ".github/workflows/server.yml"
      - "dkrix/Client/Packet/Cpackets/**"
  workflow_dispatch:

# NOTE: working-directory is set per-job, NOT at workflow level. A workflow-level
# default also applies to the `format` job, where it silently breaks the check:
# `git diff --name-only` always prints repo-relative paths (dkrixserver/src/...),
# so the subsequent `[ -f "$f" ]` test runs from inside dkrixserver/ and looks for
# dkrixserver/dkrixserver/src/... — never found, every file skipped via `continue`,
# and the job passes green having checked nothing.

jobs:
  build:
    name: make debug (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: dkrixserver

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libmysqlclient-dev \
            liblua5.1-0-dev \
            libxerces-c-dev \
            libnsl-dev
        # libnsl-dev: all three server targets link -lnsl
        # (src/server/{gameserver,loginserver,sharedserver}/CMakeLists.txt,
        # EXTRA_LIBS under the elseif(UNIX) branch). libnsl was split out of
        # glibc in 2.32 and is NOT preinstalled on ubuntu-latest, so the link
        # step failed with "ld: cannot find -lnsl" after compiling to 86%.
        # First real CI failure, 2026-08-06.

      - name: Show toolchain
        run: |
          cmake --version
          g++ --version
          pkg-config --modversion xerces-c || true

      - name: Cache build tree
        uses: actions/cache@v4
        with:
          path: dkrixserver/build
          key: server-build-${{ runner.os }}-${{ hashFiles('dkrixserver/**/CMakeLists.txt') }}
          restore-keys: server-build-${{ runner.os }}-

      # The Makefile wraps CMake: `make debug` == cmake -B build
      # -DCMAKE_BUILD_TYPE=Debug && cmake --build build.
      - name: Build (Debug)
        run: make debug

      - name: Verify binaries exist
        run: |
          set -e
          for b in gameserver loginserver sharedserver; do
            if [ ! -f "bin/$b" ]; then
              echo "::error::Expected binary bin/$b was not produced"
              exit 1
            fi
            echo "ok: bin/$b"
          done

  sanitizers:
    # Additive leg, does not replace the plain `build` job above — same
    # dependency set, invoking the debug-asan / debug-ubsan Makefile
    # targets added alongside the CMakeLists.txt USE_<SAN> options
    # (Phase 10 bullet 3, 2026-08-07). TSan is deliberately excluded
    # from the matrix, same rationale as the parked line's Phase 15D
    # (archive/modernization-phases-1-17, 56f4165): the server's thread
    # model has not been audited and TSan on un-audited code produces
    # more false-positive noise than signal until real races are
    # addressed. `make debug-tsan` still works locally.
    #
    # This sanitizer matrix has never been run against this tree before
    # — CI is the actual gate for whether -fsanitize=address/undefined
    # compiles and links clean here, not this review.
    name: build (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: dkrixserver

    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, ubsan]
        include:
          - sanitizer: asan
            make_target: debug-asan
          - sanitizer: ubsan
            make_target: debug-ubsan

    steps:
      - uses: actions/checkout@v4

      # Same dependency set as the `build` job above.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libmysqlclient-dev \
            liblua5.1-0-dev \
            libxerces-c-dev \
            libnsl-dev

      - name: Show toolchain
        run: |
          cmake --version
          g++ --version

      - name: Build (${{ matrix.make_target }})
        run: make ${{ matrix.make_target }}

      # NOTE: CMAKE_RUNTIME_OUTPUT_DIRECTORY is pinned to
      # ${CMAKE_SOURCE_DIR}/bin in CMakeLists.txt — i.e. always
      # dkrixserver/bin/, regardless of which build-* directory
      # configured it. Each matrix leg gets a fresh runner/checkout, so
      # there's no cross-leg clobbering, but the binary path itself
      # does NOT vary by sanitizer the way the build-<san> dir does.
      - name: Verify binaries exist
        run: |
          set -e
          for b in gameserver loginserver sharedserver; do
            if [ ! -f "bin/$b" ]; then
              echo "::error::Expected binary bin/$b was not produced"
              exit 1
            fi
            echo "ok: bin/$b"
          done

  format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned 2026-08-07. Unpinned apt made this gate nondeterministic:
      # the runner image's clang-format is 18.1.3, which formats two
      # CJK-comment quest files differently from every later version
      # (18.1.8 / 19.1.7 / 20.1.7 / 22.1.8 all agree with each other and
      # accept the tree as committed — measured, runs #6/#7/#9). Match it
      # locally with: pip install clang-format==18.1.8
      - name: Install clang-format (pinned)
        run: |
          sudo pip install --break-system-packages clang-format==18.1.8
          which clang-format
          clang-format --version

      # Only checks files this change actually touched, so the existing
      # unformatted backlog does not block every PR.
      - name: Check changed C++ files
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"; fi

          changed=$(git diff --name-only --diff-filter=ACM "$base" HEAD \
            | grep -E '^dkrixserver/.*\.(cpp|h|hpp)$' || true)

          if [ -z "$changed" ]; then
            echo "No server C++ files changed."
            exit 0
          fi

          checked=0
          failed=0
          for f in $changed; do
            if [ ! -f "$f" ]; then
              echo "::warning file=$f::listed as changed but not present in the worktree; skipped"
              continue
            fi
            checked=$((checked + 1))
            if ! diff -q "$f" <(clang-format "$f") >/dev/null; then
              echo "::error file=$f::Not clang-format clean. Run 'make fmt' in dkrixserver/."
              failed=1
            fi
          done

          # Guard against the failure mode this job had before: if every file is
          # skipped, the loop body never runs and the job passes green having
          # verified nothing. A non-empty change list that checks zero files is
          # a bug in this workflow, not a passing format check.
          echo "Checked $checked of $(echo "$changed" | wc -l) changed file(s)."
          if [ "$checked" -eq 0 ]; then
            echo "::error::Change list was non-empty but no file was readable — path resolution is wrong in this workflow."
            exit 1
          fi
          exit $failed

  ratchets:
    name: ratchets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Lifted from the parked line's Phase 8C / Phase 12.0 gates
    # (archive/modernization-phases-1-17, dkrixserver/scripts/) and
    # re-baselined against this tree, which never ran the migrations
    # that lowered the parked baselines. Both are grep-based ratchets:
    # today's count is frozen in a sibling `.{name}-baseline` file and
    # the job fails only if a change pushes the count ABOVE it.
    # Lowering the count (migrating sites away) is always allowed and
    # should be followed by re-running the script with --update.
    steps:
      - uses: actions/checkout@v4
        # No fetch-depth override: both scripts grep the working tree
        # as checked out and never walk git history, so the default
        # shallow (depth 1) checkout is sufficient.

      # Run via `sh`, not executed directly off the shebang. This repo
      # is authored on a Windows workstation with core.fileMode=false,
      # so the executable bit does not reliably survive `git add` —
      # every other *.sh file already in this tree (e.g.
      # dkrixserver/docker/start-servers.sh, which its own Dockerfile
      # re-chmods after COPY) is 100644 in HEAD despite being run as a
      # script. `sh script.sh` works regardless of the stored mode.

      # Phase 8C ratchet. Counts variadic/format-string SQL API call
      # sites (executeQuery/setStatement/Statement with a %[sdluxc]
      # format spec) in compiled server sources. Baseline 542, measured
      # fresh for this tree — the parked line's own baseline (567 at
      # introduction, 540 by the tag tip) reflects PreparedStatement
      # migrations (Phase 11) that do not exist here.
      - name: SQL-injection ratchet
        run: sh dkrixserver/scripts/check-sql-injection.sh

      # Phase 12.0 ratchet. Counts filename-identical packet classes
      # duplicated between dkrixserver/src/Core/ and
      # dkrix/Client/Packet/Cpackets/. Baseline 326, measured fresh for
      # this tree — every packet file in Cpackets currently has a
      # same-named server-side sibling, since the shared/Packets/
      # migrations (Phase 12) that drove the parked line's baseline
      # toward 0 do not exist here.
      - name: Packet-duplicates ratchet
        run: sh dkrixserver/scripts/check-packet-duplicates.sh
